name: Gold Price Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 時間 00:00 (台灣時間早上 8 點) 自動執行
  workflow_dispatch:      # 讓你可以手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 複製倉庫內容
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝必要套件
        run: pip install requests beautifulsoup4

      - name: 執行爬蟲
        run: python main.py

- name: 將更新後的資料存回倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          # 如果沒有變化就不 commit，避免報錯
          git diff --quiet && git diff --staged --quiet || git commit -m "Update gold price"
          git push
