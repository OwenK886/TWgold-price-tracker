name: Gold Price Scraper

on:
  schedule:
    # 台灣時間 週一至週五 12:00, 18:00, 22:00
    # 對應 UTC 時間 04:00, 10:00, 14:00
    - cron: '0 4,10,14 * * 1-5'
  workflow_dispatch:

# 加入這段環境變數，強制使用 Node.js 24 來消除警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 複製倉庫內容
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安裝必要套件
        run: pip install requests beautifulsoup4

      - name: 執行爬蟲
        run: python main.py

      - name: 將更新後的資料存回倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f data.json ]; then
            git add data.json
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "Update gold price: $(date)"
              git push
            else
              echo "資料無變動，無需更新。"
            fi
          else
            echo "錯誤：找不到 data.json 檔案，請檢查爬蟲日誌。"
            exit 1
          fi
