name: Gold Price Scraper

on:
  schedule:
    # 台灣時間 週一至週五 12:00, 18:00, 22:00
    # 對應 UTC 時間 04:00, 10:00, 14:00
    - cron: '0 4,10,14 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 這是關鍵：明確給予這個任務寫入權限
    permissions:
      contents: write
      
    steps:
      - name: 複製倉庫內容
        uses: actions/checkout@v4 # 👈 這裡升級到 v4

      - name: 設定 Python
        uses: actions/setup-python@v5 # 👈 這裡升級到 v5
        with:
          python-version: '3.9'

      - name: 安裝必要套件
        run: pip install requests beautifulsoup4

      - name: 執行爬蟲
        run: python main.py

      - name: 將更新後的資料存回倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 先檢查檔案是否存在，才進行 git add
          if [ -f data.json ]; then
            git add data.json
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "Update gold price: $(date)"
              git push
            else
              echo "資料無變動，無需更新。"
            fi
          else
            echo "錯誤：找不到 data.json 檔案，請檢查爬蟲日誌。"
            exit 1
          fi
