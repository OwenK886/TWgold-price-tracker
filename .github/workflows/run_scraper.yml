name: Gold Price Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 時間 00:00 自動執行
  workflow_dispatch:      # 讓你可以手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest
    # 這是關鍵：明確給予這個任務寫入權限
    permissions:
      contents: write
      
    steps:
      - name: 複製倉庫內容
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝必要套件
        run: pip install requests beautifulsoup4

      - name: 執行爬蟲
        run: python main.py

      - name: 將更新後的資料存回倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 先檢查檔案是否存在，才進行 git add
          if [ -f data.json ]; then
            git add data.json
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "Update gold price: $(date)"
              git push
            else
              echo "資料無變動，無需更新。"
            fi
          else
            echo "錯誤：找不到 data.json 檔案，請檢查爬蟲日誌。"
            exit 1
          fi
