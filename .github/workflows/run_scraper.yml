name: Gold Price Scraper

on:
  schedule:
    # 台灣時間週一至週五 12:00、18:00、22:00（UTC 04:00、10:00、14:00）
    - cron: '0 4,10,14 * * 1-5'
  workflow_dispatch:

# 避免排程延遲與手動執行同時更新 data.json。
concurrency:
  group: gold-price-scraper-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  TZ: Asia/Taipei

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 取得專案內容
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝 Python 套件
        run: python -m pip install --requirement requirements.txt

      - name: 快取 Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 安裝 Chromium 與系統依賴
        run: python -m playwright install --with-deps chromium

      - name: 執行單元測試
        run: |
          python -m unittest discover --start-directory tests --verbose
          node tests/frontend.test.js

      - name: 擷取臺灣銀行黃金牌價
        run: python main.py

      - name: 提交更新資料
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data.json ]]; then
            echo "錯誤：找不到 data.json，請檢查爬蟲日誌。" >&2
            exit 1
          fi

          git add -- data.json
          if git diff --cached --quiet; then
            echo "資料無變動，無需提交。"
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Update gold price: $(date --iso-8601=seconds)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
