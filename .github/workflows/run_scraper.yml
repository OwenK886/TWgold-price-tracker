name: Gold Price Scraper

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 時間 00:00 自動執行
  workflow_dispatch:      # 讓你可以手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest
    # 這是關鍵：明確給予這個任務寫入權限
    permissions:
      contents: write
      
    steps:
      - name: 複製倉庫內容
        uses: actions/checkout@v3

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安裝必要套件
        run: pip install requests beautifulsoup4

      - name: 執行爬蟲
        run: python main.py

      - name: 將更新後的資料存回倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          # 檢查是否有變動，有的話才 commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update gold price"
            git push
          else
            echo "沒有資料變動，跳過更新"
          fi
