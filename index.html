<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣黃金價格追蹤 - 臺灣銀行新臺幣黃金牌價</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #b8860b;
            --light-bg: #f8f9fa;
            --text-main: #2c3e50;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: var(--light-bg); color: var(--text-main); }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; margin-bottom: 5px; color: var(--text-main); }
        .source-tag { text-align: center; font-size: 13px; color: #7f8c8d; margin-bottom: 20px; }
        
        /* 價格看板 */
        .price-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fffcf0; border: 1px solid #f1e4bc; border-radius: 10px; padding: 20px; margin-bottom: 25px; }
        .main-price { font-size: 32px; font-weight: bold; color: var(--dark-gold); margin: 5px 0; }
        .sub-info { font-size: 14px; color: #666; }
        
        /* 篩選與分頁控制項 */
        .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; }
        
        /* 分段按鈕樣式 */
        .btn-group { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--primary-gold); }
        .range-btn { background: white; border: none; border-right: 1px solid var(--primary-gold); color: var(--dark-gold); padding: 8px 16px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .range-btn:last-child { border-right: none; }
        .range-btn.active { background: var(--primary-gold); color: white; }
        .range-btn:hover:not(.active) { background: #fff9e6; }

        /* 分頁按鈕樣式 */
        .pagination-group { display: flex; align-items: center; gap: 5px; }
        .pagination-group button { background: white; border: 1px solid #ddd; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 16px; color: #555; }
        .pagination-group button:hover:not(:disabled) { border-color: var(--primary-gold); color: var(--primary-gold); }
        .pagination-group button:disabled { opacity: 0.4; cursor: not-allowed; }
        #pageInfo { font-size: 14px; font-weight: bold; margin: 0 10px; min-width: 80px; text-align: center; }

        /* 表格樣式 */
        .table-wrapper { margin-top: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 500px; }
        th { background: #f1f3f5; padding: 12px; text-align: center; border-bottom: 2px solid #dee2e6; color: #495057; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        tr:hover { background: #fcfcfc; }
        .minguo-date { color: #2980b9; font-weight: bold; }
        .western-date { color: #999; font-size: 0.85em; display: block; }
        
        .up { color: #e74c3c; font-weight: bold; } 
        .down { color: #27ae60; font-weight: bold; }

        @media (max-width: 600px) {
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { width: 100%; justify-content: center; }
            .range-btn { flex: 1; padding: 8px 5px; font-size: 12px; }
            .pagination-group { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>臺灣黃金價格(臺銀)</h1>
    <p class="source-tag">數據來源：臺灣銀行新臺幣黃金牌價</p>

    <div class="price-box" id="latestPrice">載入中...</div>
    
    <div style="position: relative; height: 350px; margin-bottom: 20px;">
        <canvas id="goldChart"></canvas>
    </div>

    <div class="controls">
        <div class="filter-group">
            <div class="btn-group">
                <button class="range-btn" onclick="setRange('近1週', this)">近1週</button>
                <button class="range-btn" onclick="setRange('近1月', this)">近1月</button>
                <button class="range-btn active" onclick="setRange('近1年', this)">近1年</button>
                <button class="range-btn" onclick="setRange('今年', this)">今年</button>
                <button class="range-btn" onclick="setRange('全部', this)">全部</button>
            </div>
        </div>

        <div class="pagination-group">
            <button onclick="goToPage('first')" title="第一頁">«</button>
            <button onclick="changePage(-1)" id="prevBtn">‹</button>
            <span id="pageInfo">第 1 頁</span>
            <button onclick="changePage(1)" id="nextBtn">›</button>
            <button onclick="goToPage('last')" title="最後一頁">»</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>掛牌時間 (民國/西元)</th>
                    <th>賣出價</th>
                    <th>買進價</th>
                    <th>價差</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    const pageSize = 20;
    let myChart = null;
    let selectedCutoffDate = null;

    async function init() {
        try {
            const response = await fetch('data.json?t=' + new Date().getTime());
            rawData = await response.json();
            if (!rawData || rawData.length === 0) throw new Error("無數據");
            updateTopDisplay();
            applyFilter('近1年');
        } catch (e) {
            document.getElementById('latestPrice').innerText = "數據載入失敗";
        }
    }

    function setRange(range, btn) {
        document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPage = 1;
        applyFilter(range);
    }

    function applyFilter(range) {
        const lastDataPoint = new Date(rawData[rawData.length - 1].time);
        let cutoff = new Date(lastDataPoint);

        if (range === '近1週') cutoff.setDate(lastDataPoint.getDate() - 7);
        else if (range === '近1月') cutoff.setMonth(lastDataPoint.getMonth() - 1);
        else if (range === '近1年') cutoff.setFullYear(lastDataPoint.getFullYear() - 1);
        else if (range === '今年') cutoff = new Date(lastDataPoint.getFullYear(), 0, 1);
        else cutoff = new Date(0);

        selectedCutoffDate = cutoff;
        filteredData = rawData.filter(d => new Date(d.time) >= cutoff).reverse();
        
        renderTable();
        renderChart();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const start = (currentPage - 1) * pageSize;
        const pageItems = filteredData.slice(start, start + pageSize);
        const totalPages = Math.ceil(filteredData.length / pageSize) || 1;

        pageItems.forEach(item => {
            const dateParts = item.time.split(' ')[0].split('/');
            const minguoYear = parseInt(dateParts[0]) - 1911;
            const row = `<tr>
                <td><span class="minguo-date">${minguoYear}/${dateParts[1]}/${dateParts[2]}</span><span class="western-date">${item.time}</span></td>
                <td style="font-weight:bold; color:var(--dark-gold);">${item.sell}</td>
                <td>${item.buy}</td>
                <td style="color:#888;">${(item.sell - item.buy).toFixed(1)}</td>
            </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });

        document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 頁`;
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage === totalPages;
    }

    function changePage(step) {
        currentPage += step;
        renderTable();
        window.scrollTo({ top: document.querySelector('.controls').offsetTop - 20, behavior: 'smooth' });
    }

    function goToPage(target) {
        const totalPages = Math.ceil(filteredData.length / pageSize);
        currentPage = target === 'first' ? 1 : totalPages;
        renderTable();
        window.scrollTo({ top: document.querySelector('.controls').offsetTop - 20, behavior: 'smooth' });
    }

    function renderChart() {
        const ctx = document.getElementById('goldChart').getContext('2d');
        if (myChart) myChart.destroy();

        const labels = rawData.map(d => d.time);
        const sellPrices = rawData.map(d => d.sell);
        const buyPrices = rawData.map(d => d.buy);

        // 找出對應選定範圍的起始索引
        const startIndex = rawData.findIndex(d => new Date(d.time) >= selectedCutoffDate);

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: '賣出價', data: sellPrices, borderColor: '#d4af37', backgroundColor: 'rgba(212, 175, 55, 0.05)', fill: true, tension: 0.1, pointRadius: 2 },
                    { label: '買進價', data: buyPrices, borderColor: '#7f8c8d', borderDash: [5, 5], tension: 0.1, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: {
                        // 動態設定圖表顯示的範圍
                        min: labels[startIndex > -1 ? startIndex : 0],
                        max: labels[labels.length - 1]
                    }
                },
                plugins: {
                    zoom: {
                        pan: { enabled: true, mode: 'x' },
                        zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
                    }
                }
            }
        });
    }

    function updateTopDisplay() {
        const last = rawData[rawData.length - 1];
        const prev = rawData.length > 1 ? rawData[rawData.length - 2] : last;
        const diff = (last.sell - prev.sell).toFixed(1);
        const percent = ((diff / prev.sell) * 100).toFixed(2);
        let trend = diff > 0 ? `<span class="up">▲ ${diff} (+${percent}%)</span>` : (diff < 0 ? `<span class="down">▼ ${Math.abs(diff)} (${percent}%)</span>` : `<span style="color:#999">持平</span>`);

        document.getElementById('latestPrice').innerHTML = `
            <div class="sub-info">最後更新：${last.time}</div>
            <div class="main-price">${last.sell} <small style="font-size:16px; color:#666; font-weight:normal;">TWD/g</small></div>
            <div style="font-size:16px;">${trend}</div>
        `;
    }

    init();
</script>
</body>
</html>
