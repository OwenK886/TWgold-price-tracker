<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣黃金價格追蹤 - 臺灣銀行新臺幣黃金牌價</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #b8860b;
            --light-bg: #f8f9fa;
            --text-main: #2c3e50;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: var(--light-bg); color: var(--text-main); }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { text-align: center; margin-bottom: 5px; color: var(--text-main); }
        .source-tag { text-align: center; font-size: 13px; color: #7f8c8d; margin-bottom: 8px; }
        .freshness-status { width: fit-content; margin: 0 auto 20px; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
        .freshness-status.fresh { color: #237a43; background: #edf9f1; border: 1px solid #b9e3c7; }
        .freshness-status.stale { color: #9a5b00; background: #fff7e6; border: 1px solid #f0ce8a; font-weight: 600; }
        .freshness-status.error { color: #a93226; background: #fdf0ef; border: 1px solid #efc0bb; }
        
        /* 價格看板 */
        .price-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fffcf0; border: 1px solid #f1e4bc; border-radius: 10px; padding: 20px; margin-bottom: 25px; }
        .main-price { font-size: 32px; font-weight: bold; color: var(--dark-gold); margin: 5px 0; }
        .sub-info { font-size: 14px; color: #666; }
        
        /* 篩選與分頁控制項 */
        .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; }
        
        /* 分段按鈕樣式 */
        .btn-group { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid var(--primary-gold); }
        .range-btn { background: white; border: none; border-right: 1px solid var(--primary-gold); color: var(--dark-gold); padding: 8px 16px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .range-btn:last-child { border-right: none; }
        .range-btn.active { background: var(--primary-gold); color: white; }
        .range-btn:hover:not(.active) { background: #fff9e6; }

        /* 分頁按鈕樣式 */
        .pagination-group { display: flex; align-items: center; gap: 5px; }
        .pagination-group button { background: white; border: 1px solid #ddd; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 16px; color: #555; }
        .pagination-group button:hover:not(:disabled) { border-color: var(--primary-gold); color: var(--primary-gold); }
        .pagination-group button:disabled { opacity: 0.4; cursor: not-allowed; }
        #pageInfo { font-size: 14px; font-weight: bold; margin: 0 10px; min-width: 80px; text-align: center; }

        /* 表格樣式 */
        .table-wrapper { margin-top: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 500px; }
        th { background: #f1f3f5; padding: 12px; text-align: center; border-bottom: 2px solid #dee2e6; color: #495057; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        tr:hover { background: #fcfcfc; }
        .minguo-date { color: #2980b9; font-weight: bold; }
        .western-date { color: #999; font-size: 0.85em; display: block; }
        
        .up { color: #e74c3c; font-weight: bold; } 
        .down { color: #27ae60; font-weight: bold; }

        @media (max-width: 600px) {
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { width: 100%; justify-content: center; }
            .range-btn { flex: 1; padding: 8px 5px; font-size: 12px; }
            .pagination-group { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>臺灣黃金價格(臺銀)</h1>
    <p class="source-tag">數據來源：臺灣銀行新臺幣黃金牌價</p>
    <div id="freshnessStatus" class="freshness-status" role="status" aria-live="polite">正在檢查資料時間...</div>

    <div class="price-box" id="latestPrice">載入中...</div>
    
    <div style="position: relative; height: 350px; margin-bottom: 20px;">
        <canvas id="goldChart"></canvas>
    </div>

    <div class="controls">
        <div class="filter-group">
            <div class="btn-group">
                <button class="range-btn" onclick="setRange('近1週', this)">近1週</button>
                <button class="range-btn" onclick="setRange('近1月', this)">近1月</button>
                <button class="range-btn active" onclick="setRange('近1年', this)">近1年</button>
                <button class="range-btn" onclick="setRange('今年', this)">今年</button>
                <button class="range-btn" onclick="setRange('全部', this)">全部</button>
            </div>
        </div>

        <div class="pagination-group">
            <button onclick="goToPage('first')" title="第一頁">«</button>
            <button onclick="changePage(-1)" id="prevBtn">‹</button>
            <span id="pageInfo">第 1 頁</span>
            <button onclick="changePage(1)" id="nextBtn">›</button>
            <button onclick="goToPage('last')" title="最後一頁">»</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>掛牌時間 (民國/西元)</th>
                    <th>賣出價</th>
                    <th>買進價</th>
                    <th>價差</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let rawData = [];
    let filteredData = [];
    let currentPage = 1;
    const pageSize = 20;
    const staleAfterHours = 72;
    const taipeiTimeZone = 'Asia/Taipei';
    let myChart = null;

    const taipeiFormatter = new Intl.DateTimeFormat('en-CA', {
        timeZone: taipeiTimeZone,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hourCycle: 'h23'
    });

    function parseDataTime(value) {
        if (typeof value !== 'string') return null;

        // 舊資料沒有時區；明確視為臺北時間，避免 Safari 或不同地區瀏覽器解析不一致。
        const legacy = value.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})$/);
        const parsed = legacy
            ? new Date(`${legacy[1]}-${legacy[2].padStart(2, '0')}-${legacy[3].padStart(2, '0')}T${legacy[4].padStart(2, '0')}:${legacy[5]}:00+08:00`)
            : new Date(value);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function getTaipeiParts(date) {
        return Object.fromEntries(
            taipeiFormatter.formatToParts(date)
                .filter(part => part.type !== 'literal')
                .map(part => [part.type, part.value])
        );
    }

    function formatWesternDate(date) {
        const parts = getTaipeiParts(date);
        return `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}`;
    }

    function formatMinguoDate(date) {
        const parts = getTaipeiParts(date);
        return `${Number(parts.year) - 1911}/${parts.month}/${parts.day}`;
    }

    function subtractTaipeiMonths(date, months) {
        const parts = getTaipeiParts(date);
        const sourceYear = Number(parts.year);
        const sourceMonth = Number(parts.month);
        const sourceDay = Number(parts.day);
        const zeroBasedTarget = sourceYear * 12 + (sourceMonth - 1) - months;
        const targetYear = Math.floor(zeroBasedTarget / 12);
        const targetMonth = ((zeroBasedTarget % 12) + 12) % 12 + 1;
        const lastDay = new Date(Date.UTC(targetYear, targetMonth, 0)).getUTCDate();
        const targetDay = Math.min(sourceDay, lastDay);
        const offset = date.getMilliseconds() ? `.${String(date.getMilliseconds()).padStart(3, '0')}` : '';
        return new Date(
            `${targetYear}-${String(targetMonth).padStart(2, '0')}-${String(targetDay).padStart(2, '0')}` +
            `T${parts.hour}:${parts.minute}:${parts.second}${offset}+08:00`
        );
    }

    function calculateCutoff(range, now = new Date()) {
        if (range === '近1週') return new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        if (range === '近1月') return subtractTaipeiMonths(now, 1);
        if (range === '近1年') return subtractTaipeiMonths(now, 12);
        if (range === '今年') {
            const currentYear = getTaipeiParts(now).year;
            return new Date(`${currentYear}-01-01T00:00:00+08:00`);
        }
        return new Date(0);
    }

    function getFreshnessState(lastUpdated, now = new Date()) {
        const ageHours = Math.max(0, (now.getTime() - lastUpdated.getTime()) / (60 * 60 * 1000));
        if (ageHours > staleAfterHours) {
            return {
                className: 'freshness-status stale',
                text: `⚠ 資料已 ${Math.floor(ageHours)} 小時未更新，請以臺灣銀行最新牌價為準`
            };
        }
        return {
            className: 'freshness-status fresh',
            text: `資料更新正常（距今約 ${Math.floor(ageHours)} 小時）`
        };
    }

    async function init() {
        try {
            const response = await fetch('data.json?t=' + Date.now());
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            if (!Array.isArray(payload) || payload.length === 0) throw new Error('無數據');

            rawData = payload
                .map(item => ({
                    ...item,
                    buy: Number(item.buy),
                    sell: Number(item.sell),
                    parsedTime: parseDataTime(item.time)
                }))
                .filter(item => item.parsedTime && Number.isFinite(item.buy) && Number.isFinite(item.sell))
                .sort((a, b) => a.parsedTime - b.parsedTime);
            if (rawData.length === 0) throw new Error('沒有可解析的數據');

            updateTopDisplay();
            applyFilter('近1年');
        } catch (error) {
            console.error('資料載入失敗', error);
            document.getElementById('latestPrice').innerText = '數據載入失敗';
            const status = document.getElementById('freshnessStatus');
            status.className = 'freshness-status error';
            status.innerText = '無法確認資料更新狀態';
        }
    }

    function setRange(range, btn) {
        document.querySelectorAll('.range-btn').forEach(button => button.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(range);
    }

    function applyFilter(range) {
        const cutoff = calculateCutoff(range, new Date());
        currentPage = 1;
        filteredData = rawData.filter(item => item.parsedTime >= cutoff).slice().reverse();
        renderTable();
        renderChart();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const start = (currentPage - 1) * pageSize;
        const pageItems = filteredData.slice(start, start + pageSize);
        const totalPages = Math.ceil(filteredData.length / pageSize) || 1;

        if (pageItems.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="color:#888;">選定期間內沒有資料</td></tr>';
        }

        pageItems.forEach(item => {
            const row = `<tr>
                <td><span class="minguo-date">${formatMinguoDate(item.parsedTime)}</span><span class="western-date">${formatWesternDate(item.parsedTime)}</span></td>
                <td style="font-weight:bold; color:var(--dark-gold);">${item.sell.toLocaleString('zh-TW')}</td>
                <td>${item.buy.toLocaleString('zh-TW')}</td>
                <td style="color:#888;">${(item.sell - item.buy).toFixed(1)}</td>
            </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });

        document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 頁`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function changePage(step) {
        const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
        currentPage = Math.min(totalPages, Math.max(1, currentPage + step));
        renderTable();
        window.scrollTo({ top: document.querySelector('.controls').offsetTop - 20, behavior: 'smooth' });
    }

    function goToPage(target) {
        const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
        currentPage = target === 'first' ? 1 : totalPages;
        renderTable();
        window.scrollTo({ top: document.querySelector('.controls').offsetTop - 20, behavior: 'smooth' });
    }

    function renderChart() {
        const ctx = document.getElementById('goldChart').getContext('2d');
        if (myChart) myChart.destroy();

        const chartData = filteredData.slice().reverse();
        const labels = chartData.map(item => formatWesternDate(item.parsedTime));

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    { label: '賣出價', data: chartData.map(item => item.sell), borderColor: '#d4af37', backgroundColor: 'rgba(212, 175, 55, 0.05)', fill: true, tension: 0.1, pointRadius: 2 },
                    { label: '買進價', data: chartData.map(item => item.buy), borderColor: '#7f8c8d', borderDash: [5, 5], tension: 0.1, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: { x: { ticks: { maxTicksLimit: 8 } } },
                plugins: {
                    zoom: {
                        pan: { enabled: true, mode: 'x' },
                        zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
                    }
                }
            }
        });
    }

    function updateTopDisplay() {
        const last = rawData[rawData.length - 1];
        const previous = rawData.length > 1 ? rawData[rawData.length - 2] : last;
        const difference = last.sell - previous.sell;
        const percent = previous.sell ? (difference / previous.sell * 100).toFixed(2) : '0.00';
        const formattedDifference = Math.abs(difference).toFixed(1);
        const trend = difference > 0
            ? `<span class="up">▲ ${formattedDifference} (+${percent}%)</span>`
            : difference < 0
                ? `<span class="down">▼ ${formattedDifference} (${percent}%)</span>`
                : '<span style="color:#999">持平</span>';

        document.getElementById('latestPrice').innerHTML = `
            <div class="sub-info">最後更新：${formatWesternDate(last.parsedTime)}（臺北時間）</div>
            <div class="main-price">${last.sell.toLocaleString('zh-TW')} <small style="font-size:16px; color:#666; font-weight:normal;">TWD/g</small></div>
            <div style="font-size:16px;">${trend}</div>
        `;

        const freshness = getFreshnessState(last.parsedTime);
        const status = document.getElementById('freshnessStatus');
        status.className = freshness.className;
        status.innerText = freshness.text;
    }

    init();
</script>
</body>
</html>
